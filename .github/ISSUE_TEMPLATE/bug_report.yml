name: 🐛 Bug Report
description: Report a bug or issue with a component
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the form below to help us investigate and fix the issue.

  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      description: Select the component(s) where you're experiencing the issue
      multiple: true
      options:
        - AgentVisualizer
        - Avatar
        - Button
        - Card
        - Chip
        - Command
        - Conversation
        - DropdownMenu
        - HelloWorld
        - IconButton
        - LiveWaveform
        - Message
        - MicButton
        - MicSelector
        - Popover
        - Response
        - ValuePicker
        - Hooks (useAudioDevices)
        - Utilities (cn, theme)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: The component crashes when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Import the component '...'
        2. Pass props '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The component should...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, the component...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example
      description: Please provide a minimal code example that reproduces the issue
      placeholder: |
        ```tsx
        import { AgentVisualizer } from "@agora/ai-agent-uikit"

        function App() {
          return <AgentVisualizer state="listening" />
        }
        ```
      render: tsx
    validations:
      required: false

  - type: input
    id: reproduction-link
    attributes:
      label: Reproduction Link
      description: Link to a CodeSandbox, StackBlitz, or GitHub repo demonstrating the issue
      placeholder: https://codesandbox.io/s/...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: If applicable, add screenshots or videos to help explain the problem
      placeholder: Drag and drop images or videos here
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: Which version of @agora/ai-agent-uikit are you using?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: dropdown
    id: react-version
    attributes:
      label: React Version
      description: Which version of React are you using?
      options:
        - React 19.x
        - React 18.x
        - React 17.x or earlier
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser(s) are you seeing the issue in?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Mobile Chrome (Android)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS are you using?
      placeholder: e.g., macOS 14.0, Windows 11, Ubuntu 22.04
    validations:
      required: true

  - type: dropdown
    id: build-tool
    attributes:
      label: Build Tool / Framework
      description: What are you using to build your app?
      options:
        - Next.js
        - Vite
        - Create React App
        - Webpack
        - Other
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (blocking production)
        - High (major functionality broken)
        - Medium (workaround available)
        - Low (minor issue)
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: |
        - Does this happen in development, production, or both?
        - Any relevant error messages from console?
        - Any custom configuration?
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to make sure this hasn't been reported before
          required: true
        - label: I am using the latest version of @agora/ai-agent-uikit
          required: false
        - label: I have provided a minimal code example or reproduction link
          required: false
